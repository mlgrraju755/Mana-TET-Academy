<script>

let answers=Array(questions.length).fill(null),current=0,finished=false,seconds=1800;
const $=id=>document.getElementById(id);
function render(){
 const q=questions[current];$('qnum').textContent='ప్రశ్న '+(current+1);$('question').textContent=q.question;$('options').innerHTML='';
 q.options.forEach((op,i)=>{
  const label=document.createElement('label');label.className='option'+(answers[current]===i+1?' selected':'');
  const input=document.createElement('input');input.type='radio';input.name='answer';input.checked=answers[current]===i+1;
  const span=document.createElement('span');span.textContent=(i+1)+') '+op;
  input.addEventListener('change',()=>{answers[current]=i+1;render();});
  label.append(input,span);$('options').append(label);
 });
 $('prev').disabled=current===0;$('next').disabled=current===questions.length-1;renderMeta();
}
function renderMeta(){const count=answers.filter(x=>x!==null).length;$('progressText').textContent=`ప్రశ్న ${current+1} / ${questions.length} • సమాధానాలు ${count}`;$('bar').style.width=(count/questions.length*100)+'%';}
$('prev').onclick=()=>{if(current>0){current--;render();}};
$('next').onclick=()=>{if(current<questions.length-1){current++;render();}};
$('submit').onclick=()=>{const n=answers.filter(x=>x===null).length;if(n&&!confirm(`${n} ప్రశ్నలకు సమాధానం ఇవ్వలేదు. అయినా పరీక్షను Submit చేయాలా?`))return;finish();};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function finish(){
 if(finished)return;finished=true;clearInterval(clock);let score=0;questions.forEach((q,i)=>{if(answers[i]===q.answer)score++;});
 $('quizCard').style.display='none';const result=$('result');result.style.display='block';
 let out=`<h2>మీ పరీక్ష ఫలితం</h2><div class="score">${score} / ${questions.length}</div><p>సరైన సమాధానాలు: ${score} &nbsp; | &nbsp; తప్పు / సమాధానం ఇవ్వనివి: ${questions.length-score}</p><hr><h3>సమాధానాల సమీక్ష</h3>`;
 questions.forEach((q,i)=>{const ok=answers[i]===q.answer;out+=`<div class="review"><b>ప్రశ్న ${i+1}.</b> ${esc(q.question)}<br><span class="${ok?'correct':'wrong'}">${ok?'సరైన సమాధానం':'మీ సమాధానం తప్పు / ఇవ్వలేదు'}</span><br>మీ సమాధానం: ${answers[i]===null?'ఇవ్వలేదు':answers[i]}<br><b>సరైన సమాధానం: ${q.answer}) ${esc(q.options[q.answer-1])}</b></div>`;});
 out+='<p><button class="primary" onclick="location.reload()">మళ్లీ పరీక్ష రాయండి</button></p>';result.innerHTML=out;window.scrollTo(0,0);
}
function tick(){if(finished)return;seconds--;const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');$('timer').textContent=m+':'+s;if(seconds<=0){alert('సమయం ముగిసింది. మీ పరీక్షను Submit చేస్తున్నాము.');finish();}}
const clock=setInterval(tick,1000);render();
</script></body></html>
