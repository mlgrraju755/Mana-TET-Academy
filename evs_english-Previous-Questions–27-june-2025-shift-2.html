<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mana TET 2026 - TG TET Paper-I Environmental Studies Practice Test">
<title>Mana TET 2026 | Environmental Studies Questions 121–150</title>
<style>
:root{--primary:#174ea6;--accent:#ffb300;--bg:#f3f6fb;--ink:#172033;--muted:#64748b;--green:#16834a;--red:#c62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Noto Sans Telugu","Gautami","Nirmala UI",Arial,sans-serif;color:var(--ink);line-height:1.7}
header{background:linear-gradient(135deg,#123b78,#2468c7);color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:clamp(23px,5vw,32px)}
header p{margin:5px 0 0;font-size:15px}
.wrap{max-width:850px;margin:18px auto;padding:0 12px 35px}
.topbar,.card,.result{background:#fff;border-radius:14px;box-shadow:0 3px 14px #13294b12}
.topbar{padding:14px 16px;margin-bottom:14px}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;color:#24456f}
.progress{height:9px;background:#e5eaf2;border-radius:20px;margin-top:10px;overflow:hidden}
#bar{height:100%;width:0;background:var(--accent);transition:width .25s}
.card{padding:20px;margin-bottom:14px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.badge{background:#e8f0fe;color:var(--primary);font-weight:800;padding:4px 11px;border-radius:20px;white-space:nowrap}
.question{font-size:18px;font-weight:700;white-space:pre-line}
.options{display:grid;gap:10px;margin-top:18px}
.option{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1.5px solid #d9e1ee;border-radius:10px;cursor:pointer;background:#fff;transition:.15s}
.option:hover{border-color:#6b91d5;background:#f7faff}
.option input{margin-top:7px;accent-color:var(--primary);transform:scale(1.15)}
.option.correct{border-color:var(--green);background:#eaf7ef}
.option.wrong{border-color:var(--red);background:#fff0f0}
.feedback{margin-top:14px;padding:11px 13px;border-radius:9px;font-weight:700;display:none}
.feedback.good{display:block;background:#eaf7ef;color:#12683b}
.feedback.bad{display:block;background:#fff0f0;color:#a51e1e}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:9px;padding:11px 17px;font-size:15px;font-weight:700;cursor:pointer}
.primary{background:var(--primary);color:white}
.secondary{background:#e8edf5;color:#24344e}
.copy-btn{background:#fff8e1;color:#8a5a00;border:1px solid #ffd54f;padding:7px 12px;font-size:13px}
.copy-btn:hover{background:#ffecb3}
button:disabled{opacity:.45;cursor:not-allowed}
.result{padding:18px;text-align:center;margin-bottom:14px;display:none}
.result h2{margin:0 0 5px;color:var(--primary)}
.small{font-size:13px;color:var(--muted);text-align:center;margin-top:15px}
.navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
.navgrid button{padding:7px 2px;background:#e8edf5;color:#25334a;font-size:13px}
.navgrid button.done{background:#d9f0e3;color:#12683b}
.navgrid button.current{outline:2px solid var(--primary)}
.copy-toast{font-size:13px;font-weight:700;color:var(--green);margin-left:8px;display:none}
@media(max-width:480px){.card{padding:15px}.question{font-size:16px}.navgrid{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<header>
<h1>Mana TET 2026</h1>
<p>Paper–I | Environmental Studies (పర్యావరణ అధ్యయనం)</p>
<p>Previous Question Paper • 27 June 2025 • Shift–2 • English Medium</p>
</header>
<main class="wrap">
<section class="topbar">
<div class="meta"><span id="progressText">Question 121 / 150</span><span id="scoreText">Correct Answers: 0</span></div>
<div class="progress"><div id="bar"></div></div>
</section>
<section id="result" class="result"></section>
<section class="card">
<div class="qhead">
<span class="badge" id="qnum">Q121</span>
<div>
<button class="copy-btn" type="button" onclick="copyCurrentQuestion(false)">Copy Q &amp; Options</button>
<button class="copy-btn" type="button" onclick="copyCurrentQuestion(true)">Copy with Answer</button>
<span id="copyStatus" class="copy-toast">Copied!</span>
</div>
</div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
<div id="feedback" class="feedback"></div>
<div class="controls">
<button class="primary" id="checkBtn" onclick="checkAnswer()">సమాధానం తనిఖీ చేయండి</button>
<button class="secondary" id="prevBtn" onclick="move(-1)" disabled>← వెనుకకు</button>
<button class="primary" id="nextBtn" onclick="move(1)" disabled>తదుపరి →</button>
<button class="secondary" id="restartBtn" onclick="restart()" style="display:none">మళ్లీ ప్రారంభించండి</button>
<button class="secondary" type="button" onclick="copyAllQuestions()">Copy All 30 Qs + Key</button>
</div>
</section>
<section class="card">
<strong>ప్రశ్నలకు వెళ్లండి (121–150)</strong>
<div class="navgrid" id="navgrid"></div>
</section>
<p class="small">TG TET Paper-I • Environmental Studies Questions 121–150 • Mana TET Academy</p>
</main>
<script>
const questions = [
  {"num": "Q121", "q": "In a village, many people were found to have swollen necks. What could be the main reason behind this?", "opts": ["Deficiency of iodine", "Lack of exercise", "Drinking too much milk", "Eating spicy food"], "a": 1},
  {"num": "Q122", "q": "Identify the marine fish among the following:", "opts": ["Tuna", "Catla", "Rohu", "Mrigal"], "a": 1},
  {"num": "Q123", "q": "“Lyla” is the name of which of the following natural phenomena?", "opts": ["Earthquake", "Tsunami", "Cyclone", "Flood"], "a": 3},
  {"num": "Q124", "q": "From the following plant, which one does NOT have flowers?", "opts": ["Grass", "Maize", "Chilli", "Fern"], "a": 4},
  {"num": "Q125", "q": "Air exerts pressure in this direction:\nA) Upward direction\nB) Downward direction\nC) Sideways\nWhich of the following is correct?", "opts": ["A & B only", "B & C only", "A & C only", "A, B & C"], "a": 4},
  {"num": "Q126", "q": "Creating new natural resources is NOT possible, so we should:", "opts": ["Use more fossil fuels for faster development", "Use more natural resources because they are renewable", "Avoid using any natural resources at all", "Use natural resources in a proper and sustainable way"], "a": 4},
  {"num": "Q127", "q": "What is used to measure the tremors or vibrations of the Earth during an earthquake?", "opts": ["Thermometer", "Barometer", "Richter Scale", "Anemometer"], "a": 3},
  {"num": "Q128", "q": "The protein mainly contained in the fleece of a sheep is:", "opts": ["Collagen", "Keratin", "Elastin", "Casein"], "a": 2},
  {"num": "Q129", "q": "When cotton fiber is separated from seeds, the process is called:", "opts": ["Spinning", "Ginning", "Weaving", "Carding"], "a": 2},
  {"num": "Q130", "q": "The number of neck bones in humans compared to that in giraffes is:", "opts": ["Less than giraffes", "More than giraffes", "The same as giraffes", "Twice the number of giraffes"], "a": 3},
  {"num": "Q131", "q": "Peptic ulcer is caused due to:", "opts": ["Viral infection", "Bacterial infection by Helicobacter pylori", "Lack of water intake", "Low blood sugar"], "a": 2},
  {"num": "Q132", "q": "Match the following blood components with their other names and choose the correct option:\nBlood Components: A) Platelets | B) Red blood cells | C) White blood cells\nOther Names: i) Erythrocytes | ii) Leucocytes | iii) Thrombocytes", "opts": ["A – iii, B – i, C – ii", "A – ii, B – iii, C – i", "A – i, B – ii, C – iii", "A – iii, B – ii, C – i"], "a": 1},
  {"num": "Q133", "q": "Among the following, identify the perennial rivers:", "opts": ["The Krishna and the Godavari", "The Thunga bhadra and the Mahanadi", "The Narmada and the Tapati", "The Yamuna and the Sutlez"], "a": 4},
  {"num": "Q134", "q": "On the surface of this, the maximum evaporation and the cloud formation takes place:", "opts": ["Land", "Mountains", "Oceans and seas", "Rivers and Reservoirs"], "a": 3},
  {"num": "Q135", "q": "Towards the close of the summer season, pre-monsoon showers are common especially in Kerala and Karnataka, which help for the:", "opts": ["Undertaking of agricultural activities by the farmers", "Destruction of mango fruits", "Early ripening of mangoes", "Destruction of Paddy crop"], "a": 3},
  {"num": "Q136", "q": "Who among the following was credited with the initial introduction of the Ryotwari system in the Madras Presidency?", "opts": ["Lord Cornwallis", "Thomas Munro", "Charles Metcalfe", "Lord William Bentick"], "a": 2},
  {"num": "Q137", "q": "Public Distribution System is the most important step taken by the Government of India towards:", "opts": ["ensuring food security to all the people", "systematic distribution of food to all the people of the country especially who are below poverty line", "ensuring food security only to the people who are in below poverty line", "supplying of food material to all the people at free of cost"], "a": 2},
  {"num": "Q138", "q": "The money deposited in this account CANNOT be withdrawn from the bank as and when required by the depositor:", "opts": ["Savings Bank Account", "Current Account", "Small Savings Account", "Fixed Account Deposit"], "a": 4},
  {"num": "Q139", "q": "During the first 20 years of the Indian National Congress, the congress was led by these leaders:", "opts": ["Democrats", "Extremist Nationalists", "Moderate Nationalists", "Gandhians"], "a": 3},
  {"num": "Q140", "q": "Who among the following was called as ‘Sahaja Kavi’?", "opts": ["Nannayya", "Thikkanna", "Pothana", "Erra Pragada"], "a": 3},
  {"num": "Q141", "q": "Khandariya Mahadeva Temple was constructed by this dynasty ruler:", "opts": ["Chalukyas of Badami", "Saluva Dynasty rulers", "Chola Dynasty rulers", "Chandela Dynasty rulers"], "a": 4},
  {"num": "Q142", "q": "In a state of Telangana, the ‘Bill’ becomes an Act, when:", "opts": ["the bill is passed in the State Legislative Assembly only", "the bill is passed in the State Legislative Assembly and the State Legislative Council only", "the bill is passed in the State Legislative Assembly and the State Legislative Council and after the approval of the State Governor", "When the bill is approved by the Governor and the Chief Secretary"], "a": 3},
  {"num": "Q143", "q": "The Parliament of India alone is empowered to make laws on this subject:", "opts": ["Irrigation, Police and Health", "Education", "Money and Banking", "Factories or Industries"], "a": 3},
  {"num": "Q144", "q": "The festival of Moharram is celebrated commemorating:", "opts": ["the battle of Karbala in which the grandson of Prophet Mohammed was killed", "the birth of Prophet Mohammed", "the day on which the holy book ‘Quran’ is written", "The day in which the heroes of Kanauj won the war"], "a": 1},
  {"num": "Q145", "q": "What does each letter in ‘DIGA’ in Graphic organizers represent?", "opts": ["Divide, Infer, Generate, Assess", "Describe, Interpret, Generalize, Apply", "Deduce, Initiate, Generate, Amend", "Describe, Infer, Generalize, Attend"], "a": 2},
  {"num": "Q146", "q": "Which of the following is NOT a characteristic feature of a ‘Project’?", "opts": ["Should be challenging", "Should enable the students work democratically", "Should be applicable in real life", "Should be more time consuming and expensive"], "a": 4},
  {"num": "Q147", "q": "In assessing a textbook using Hunter’s Score Card, out of 1000 points of the scale, the points allotted to assignments and projects given in the textbook are:", "opts": ["140", "250", "60", "100"], "a": 1},
  {"num": "Q148", "q": "Which of the following statements relating to environmental studies are TRUE?\nA) Environment is of two types – natural and social\nB) Natural and social environment are independent and do not interact with each other\nC) Biological environment includes plants and animals\nChoose the correct answer:", "opts": ["A, B & C", "A & B only", "A & C only", "B & C only"], "a": 3},
  {"num": "Q149", "q": "In Problem Solving method the step that follows ‘defining problem’:", "opts": ["Organising information", "Collection of data", "Identifying problem", "Finding solution"], "a": 2},
  {"num": "Q150", "q": "In a map roads on hills and on plane land:", "opts": ["both are shown by straight lines", "both are shown by curved lines", "are shown by straight and curved lines respectively", "are shown by curved and straight lines respectively"], "a": 4}
];

let current=0, answers=Array(questions.length).fill(null), checked=Array(questions.length).fill(false);
const $=id=>document.getElementById(id);

function render(){
 const item=questions[current];
 $('qnum').textContent=item.num;
 $('question').textContent=item.q;
 $('options').innerHTML='';
 item.opts.forEach((op,i)=>{
   const label=document.createElement('label'); label.className='option';
   const radio=document.createElement('input'); radio.type='radio';radio.name='answer';radio.value=i+1;
   radio.checked=answers[current]===i+1; radio.disabled=checked[current];
   radio.addEventListener('change',()=>{answers[current]=i+1;});
   const span=document.createElement('span');span.textContent=(i+1)+') '+op;
   label.append(radio,span);
   if(checked[current] && i+1===item.a) label.classList.add('correct');
   if(checked[current] && answers[current]===i+1 && answers[current]!==item.a) label.classList.add('wrong');
   $('options').appendChild(label);
 });
 $('feedback').className='feedback';$('feedback').textContent='';
 if(checked[current]){
   const ok=answers[current]===item.a;
   $('feedback').classList.add(ok?'good':'bad');
   $('feedback').textContent=ok?'✓ సరైన సమాధానం!':'✗ తప్పు సమాధానం. సరైన సమాధానం: '+item.a+') '+item.opts[item.a-1];
 }
 $('checkBtn').style.display=checked[current]?'none':'inline-block';
 $('nextBtn').disabled=!checked[current] || current===questions.length-1;
 $('prevBtn').disabled=current===0;
 $('progressText').textContent='Question '+(current+121)+' / 150';
 $('scoreText').textContent='Correct Answers: '+answers.filter((a,i)=>checked[i]&&a===questions[i].a).length;
 $('bar').style.width=((current+1)/questions.length*100)+'%';
 $('restartBtn').style.display=(checked.every(Boolean))?'inline-block':'none';
 renderNav();
 if(checked.every(Boolean)) showResult();
}

function checkAnswer(){
 if(!answers[current]){alert('దయచేసి ఒక సమాధానాన్ని ఎంచుకోండి.');return;}
 checked[current]=true;render();
}

function move(d){current=Math.max(0,Math.min(questions.length-1,current+d));render();}
function go(n){current=n;render();}

function renderNav(){
 $('navgrid').innerHTML='';
 questions.forEach((q,i)=>{
  const b=document.createElement('button');b.textContent=i+121;
  if(checked[i])b.classList.add('done');if(i===current)b.classList.add('current');
  b.onclick=()=>go(i);$('navgrid').appendChild(b);
 });
}

function showResult(){
 const score=answers.filter((a,i)=>a===questions[i].a).length;
 $('result').style.display='block';
 $('result').innerHTML='<h2>మీ పరీక్ష ఫలితం</h2><div style="font-size:30px;font-weight:800">'+score+' / '+questions.length+'</div><p>శాతం: '+Math.round(score/questions.length*100)+'%</p><p>సరైన సమాధానాలు: '+score+' | తప్పు సమాధానాలు: '+(questions.length-score)+'</p>';
}

function restart(){current=0;answers=Array(questions.length).fill(null);checked=Array(questions.length).fill(false);$('result').style.display='none';render();window.scrollTo({top:0,behavior:'smooth'});}

function showCopied(msg='Copied!'){
 const el=$('copyStatus');
 el.textContent=msg;
 el.style.display='inline';
 clearTimeout(window._copyTimer);
 window._copyTimer=setTimeout(()=>{el.style.display='none';},1800);
}

function copyText(text, msg){
 if(navigator.clipboard && navigator.clipboard.writeText){
   navigator.clipboard.writeText(text).then(()=>showCopied(msg)).catch(()=>fallbackCopy(text, msg));
 } else {
   fallbackCopy(text, msg);
 }
}

function fallbackCopy(text, msg){
 const ta=document.createElement('textarea');
 ta.value=text;
 document.body.appendChild(ta);
 ta.select();
 document.execCommand('copy');
 document.body.removeChild(ta);
 showCopied(msg);
}

function copyCurrentQuestion(includeAnswer){
 const item=questions[current];
 let out=item.num+'. '+item.q+'\n'+item.opts.map((o,idx)=>(idx+1)+') '+o).join('\n');
 if(includeAnswer){
   out+='\nAnswer: '+item.a+') '+item.opts[item.a-1];
 }
 copyText(out, includeAnswer?'Copied with Answer!':'Copied Q & Options!');
}

function copyAllQuestions(){
 const all=questions.map(item=>
   item.num+'. '+item.q+'\n'+
   item.opts.map((o,idx)=>(idx+1)+') '+o).join('\n')+'\n'+
   'Answer: '+item.a+') '+item.opts[item.a-1]
 ).join('\n\n----------------------------------------\n\n');
 copyText(all, 'Copied All 30 Qs + Key!');
}

render();
</script>
</body>
</html>
