<script>

const letters=['A','B','C','D'];let answers=Array(questions.length).fill(null),finished=false;
function render(){const root=document.getElementById('quiz');root.innerHTML='';questions.forEach((q,i)=>{const card=document.createElement('section');card.className='card';
const title=document.createElement('div');title.className='qtitle';title.textContent=(i+121)+'. '+q[0];card.appendChild(title);
q[1].forEach((op,j)=>{const label=document.createElement('label');label.className='opt';label.id='opt'+i+'_'+j;const radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=j;radio.onchange=()=>selectAnswer(i,j);const span=document.createElement('span');span.textContent=letters[j]+') '+op;label.appendChild(radio);label.appendChild(span);card.appendChild(label);});
const fb=document.createElement('div');fb.className='feedback';fb.id='fb'+i;card.appendChild(fb);root.appendChild(card);});updateProgress();}
function selectAnswer(i,j){if(finished)return;answers[i]=j;for(let k=0;k<4;k++){document.getElementById('opt'+i+'_'+k).classList.remove('correct','wrong');}
const c=questions[i][2];document.getElementById('opt'+i+'_'+c).classList.add('correct');if(j!==c)document.getElementById('opt'+i+'_'+j).classList.add('wrong');
document.getElementById('fb'+i).textContent=j===c?'✓ సరైన సమాధానం':'✗ తప్పు సమాధానం. సరైన సమాధానం: '+letters[c];updateProgress();}
function updateProgress(){const done=answers.filter(x=>x!==null).length;const score=answers.reduce((s,a,i)=>s+(a===questions[i][2]?1:0),0);
document.getElementById('count').textContent='సమాధానాలు: '+done+' / '+questions.length;document.getElementById('scoreLive').textContent='సరైనవి: '+score;document.getElementById('progress').style.width=(done/questions.length*100)+'%';}
function finishQuiz(){finished=true;const attempted=answers.filter(x=>x!==null).length;const correct=answers.reduce((s,a,i)=>s+(a===questions[i][2]?1:0),0);const wrong=attempted-correct;const unanswered=questions.length-attempted;
const r=document.getElementById('result');r.style.display='block';r.innerHTML='<h2>మీ పరీక్ష ఫలితాలు</h2><h1>'+correct+' / '+questions.length+'</h1><p>సరైన సమాధానాలు: '+correct+'</p><p>తప్పు సమాధానాలు: '+wrong+'</p><p>సమాధానం ఇవ్వనివి: '+unanswered+'</p><p><b>శాతం: '+(correct/questions.length*100).toFixed(2)+'%</b></p>';
document.querySelectorAll('input[type=radio]').forEach(x=>x.disabled=true);r.scrollIntoView({behavior:'smooth'});}
function restartQuiz(){answers=Array(questions.length).fill(null);finished=false;document.getElementById('result').style.display='none';render();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script></body></html>
