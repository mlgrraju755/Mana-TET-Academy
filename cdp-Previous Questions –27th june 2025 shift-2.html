<script>
const questions = [
{q:"గ్రామీణ మరియు మారుమూల ప్రాంతాల్లో కింది వాటిలో ఏవి లేకపోవడం వల్ల అభ్యసన ఫలితాలు ప్రభావితమవుతాయి?\nA) రవాణా సౌకర్యాలు\nB) సాంకేతికత\nC) తల్లిదండ్రుల సంరక్షణ",opts:["A మరియు C మాత్రమే","A మరియు B మాత్రమే","B మరియు C మాత్రమే","A, B మరియు C"],correct:1,exp:"సమాధాన సూచిక ప్రకారం రవాణా సౌకర్యాలు, సాంకేతికత లేకపోవడం అభ్యసన ఫలితాలను ప్రభావితం చేస్తాయి."},
{q:"బోధనలో పునశ్చరణ కోసం తగిన పరీక్షా సాధనాలను ఏ దశలో ఉపయోగిస్తారు?",opts:["బోధనానంతర దశ","బోధనాపూర్వ దశ","బోధనాకాల దశ","పరిచయ దశ"],correct:0,exp:"సమాధాన సూచిక ప్రకారం సరైన సమాధానం బోధనానంతర దశ."},
{q:"వికీపీడియా ఒక ఉచిత ఆన్‌లైన్ విజ్ఞాన సృష్టి, సమస్యా పరిష్కారంలో అనేక మంది కలిసి పాల్గొనే సర్వస్వం. ఈ విధానం ఏ రకమైన అభ్యసనానికి ఉదాహరణ?",opts:["పరిశీలనాత్మక అభ్యసనం","సహకార అభ్యసనం","అన్వేషణ ఆధారిత విధానం","ప్రాజెక్టు ఆధారిత విధానం"],correct:1,exp:"అనేక మంది కలిసి విజ్ఞానాన్ని సృష్టించడం, సమస్యలను పరిష్కరించడం సహకార అభ్యసనానికి ఉదాహరణ."},
{q:"వికలాంగుల హక్కుల చట్టం (RPwD), 2016లో వికలాంగులపై దుర్వినియోగం, హింస, దోపిడీ నుంచి రక్షణకు సంబంధించిన సెక్షన్ ఏది?",opts:["సెక్షన్ 7","సెక్షన్ 5","సెక్షన్ 4","సెక్షన్ 6"],correct:0,exp:"ఈ ప్రశ్నకు PDF సమాధాన సూచికలో సెక్షన్ 7గా ఇవ్వబడింది."},
{q:"జాతీయ పాఠ్య ప్రణాళికా చట్రం (NCF), 2005లో కింది వాటిలో సిఫారసు చేయనిది ఏది?",opts:["‘భారం లేని అభ్యసనం’ సూచనల ఆధారంగా పాఠ్య ప్రణాళిక భారాన్ని తగ్గించడం","బహుళత్వ సమాజంలో జాతీయ విద్యా వ్యవస్థను బలోపేతం చేయడం","పిల్లల ఆర్థిక స్థితి ఆధారంగా విద్యను అందించడం","పిల్లలందరికీ నాణ్యమైన విద్యను అందించడం"],correct:2,exp:"పిల్లల ఆర్థిక స్థితి ఆధారంగా విద్యను అందించడం NCF 2005 సిఫారసు కాదు."},
{q:"విద్యార్థుల్లో ఆశించిన అభ్యసనాన్ని కలిగించలేని ఉపాధ్యాయ ప్రవర్తన ఏది?",opts:["దృఢ సంకల్పం","స్వీయ నియంత్రణ","సరళత","క్రమశిక్షణను మాత్రమే కోరే స్వభావం"],correct:3,exp:"క్రమశిక్షణను మాత్రమే కోరే స్వభావం ఆశించిన అభ్యసనానికి ఆటంకం కలిగించవచ్చు."},
{q:"లైంగిక నేరాల నుంచి పిల్లల రక్షణ (POCSO) చట్టం, 2012లోని సెక్షన్ 11 ప్రకారం లైంగిక వేధింపులకు పాల్పడిన వ్యక్తికి సెక్షన్ 12 కింద విధించే జైలు శిక్ష ఎంత?",opts:["1 సంవత్సరం","5 సంవత్సరాలు","3 సంవత్సరాలు","7 సంవత్సరాలు"],correct:2,exp:"ఈ ప్రశ్నకు PDF సమాధాన సూచికలో మూడు సంవత్సరాలుగా ఇవ్వబడింది."},
{q:"స్థానిక సమస్యకు పరిష్కారం కనుగొనడానికి విద్యార్థులకు పరిశోధనా ప్రాజెక్టును ఇచ్చి, స్థానిక సంస్థతో కలిసి పనిచేయమని ఉపాధ్యాయురాలు సూచించింది. ఈ సందర్భంలో అభ్యసన వనరుగా ఉపయోగపడేది ఏది?",opts:["సాంకేతికత","పాఠశాల","ఆట","సమాజం"],correct:3,exp:"స్థానిక సంస్థలతో కలిసి పనిచేయడం ద్వారా సమాజం అభ్యసన వనరుగా ఉపయోగపడుతుంది."},
{q:"రుషిక ఇంజినీరింగ్ పూర్తి చేసి, తన ప్రత్యేక నైపుణ్య రంగంలో ఉద్యోగం పొందలేక నిరాశకు గురైంది. ఉద్యోగ మార్కెట్‌లోని మార్పులు, ఉద్యోగ అవకాశాల గురించి తెలుసుకోవడానికి ఆమెకు ఏ రకమైన మార్గదర్శకత్వం అవసరం?",opts:["విద్యాపరమైన మార్గదర్శకత్వం","వృత్తిపరమైన మార్గదర్శకత్వం","మానసిక మార్గదర్శకత్వం","నిర్దేశక మార్గదర్శకత్వం"],correct:1,exp:"ఉద్యోగ అవకాశాలు, ఉద్యోగ మార్కెట్, వృత్తి ఎంపికల గురించి తెలుసుకోవడానికి వృత్తిపరమైన మార్గదర్శకత్వం అవసరం."},
{q:"ఇద్దరు బాలికలు కొత్త రెస్టారెంట్‌కు వెళ్లారు. లోపలి వాతావరణాన్ని చూసి ఏదో అసౌకర్యంగా భావించి వెంటనే బయటకు వచ్చారు. ఇది ఏ రకమైన ఆలోచనకు ఉదాహరణ?",opts:["అంతర్దృష్టి ఆధారిత ఆలోచన","విభిన్న ఆలోచన","విశ్లేషణాత్మక ఆలోచన","సమ్మిళిత ఆలోచన"],correct:0,exp:"పరిస్థితిని చూసిన వెంటనే అంతర్గత అవగాహనతో నిర్ణయానికి రావడాన్ని అంతర్దృష్టి ఆధారిత ఆలోచన అంటారు."},
{q:"కింది వాక్యాలను చదివి సరైన సమాధానాన్ని గుర్తించండి.\nA) ప్రాక్సిమో-డిస్టల్ సూత్రం ప్రకారం అభివృద్ధి శరీర కేంద్రం నుంచి అంచుల వైపుకు సాగుతుంది.\nB) ఒక శిశువు మొదట ఆధారంతో కూర్చుని, ఆ తర్వాత నిలబడి నడవడం ప్రారంభిస్తుంది.",opts:["A, B రెండూ సరైనవి; B అనేది Aకు ఉదాహరణ","A, B రెండూ సరైనవి; అయితే B అనేది Aకు ఉదాహరణ కాదు","A సరైనది; B తప్పు","A తప్పు; B సరైనది"],correct:1,exp:"PDF సమాధాన సూచిక ప్రకారం A, B రెండూ సరైనవి; అయితే B అనేది Aకు ఉదాహరణ కాదు."},
{q:"పెరుగుదల మరియు అభివృద్ధిని ప్రభావితం చేసే కింది ప్రక్రియల్లో నియంత్రించగలిగేది కానిది ఏది?",opts:["ప్రేరణ","అభ్యసనం","పరిపక్వత","పరిసరాలు"],correct:2,exp:"సమాధాన సూచిక ప్రకారం పరిపక్వతను నియంత్రించలేము."},
{q:"సాధారణంగా తల్లిని మాత్రమే గుర్తించే శిశువు, ఇతర కుటుంబ సభ్యులను చూసి కూడా నవ్వడం, గుర్తించడం ప్రారంభించింది. ఈ సామాజిక అభివృద్ధి ఆధారంగా ఆ శిశువు వయస్సు సుమారుగా ఎంత?",opts:["ఆరు నెలలు","ఒక నెల","12 నెలలు","24 నెలలు"],correct:0,exp:"PDF సమాధాన సూచిక ప్రకారం సరైన సమాధానం ఆరు నెలలు."},
{q:"ఒక వ్యక్తి కొన్ని అభివృద్ధి పనులను నిర్వర్తించగలడని ఆశించే వయస్సును ఏమంటారు?",opts:["కాలక్రమ వయస్సు","మానసిక వయస్సు","జీవశాస్త్ర వయస్సు","సంక్షోభ వయస్సు"],correct:3,exp:"PDF సమాధాన సూచికలో సరైన సమాధానంగా ‘సంక్షోభ వయస్సు’ ఇవ్వబడింది."},
{q:"నాలుగేళ్ల బాలుడిలో సానుకూల ప్రవర్తనను ప్రోత్సహించడం వల్ల ఎరిక్సన్ మానసిక-సామాజిక అభివృద్ధి సిద్ధాంతం ప్రకారం ఏ లక్షణం అభివృద్ధి చెందుతుంది?",opts:["పరిశ్రమ","చొరవ","విశ్వాసం","స్వయంప్రతిపత్తి"],correct:1,exp:"ఎరిక్సన్ సిద్ధాంతంలో ఈ వయస్సు దశలో చొరవ (Initiative) అభివృద్ధి చెందుతుంది."},
{q:"పియాజే జ్ఞానాత్మక అభివృద్ధి సిద్ధాంతంలోని పూర్వ-సంకల్పనాత్మక దశకు సంబంధించిన ఉదాహరణను గుర్తించండి.",opts:["చెత్తను స్నేహపూర్వకంగా పారవేసే నమూనాను తయారు చేసే బాలుడు","‘నాకు ఇష్టమైన రంగు గులాబీ, కానీ నా సోదరి రంగు పసుపు’ అని ఉపాధ్యాయునికి చెప్పే బాలుడు","రోడ్డుపై కనిపించిన కుక్కను తన పెంపుడు కుక్క పేరుతో పిలిచే రెండేళ్ల బాలుడు","ఆకారాలు వేరుగా ఉన్నా రెండు గ్లాసుల్లో నీటి పరిమాణం సమానమని అర్థం చేసుకునే బాలుడు"],correct:2,exp:"PDF సమాధాన సూచిక ప్రకారం రోడ్డుపై కనిపించిన కుక్కను తన పెంపుడు కుక్క పేరుతో పిలిచే రెండేళ్ల బాలుడు సరైన ఉదాహరణ."},
{q:"పరిష్కారం సాధారణ అలవాటైన చర్యల ద్వారా లభించనప్పుడు సమస్యా పరిష్కార ప్రవర్తన ఏర్పడుతుంది. ఇది దేనిని సూచిస్తుంది?",opts:["సాధారణ అలవాటైన చర్యలు","మానసిక పని","ఉద్దేశపూర్వక చర్యలు","క్రమబద్ధంగా నిర్వహించిన దశలు"],correct:0,exp:"PDF సమాధాన సూచిక ప్రకారం సరైన సమాధానం సాధారణ అలవాటైన చర్యలు."},
{q:"కౌముది తన స్నేహితులతో ట్రెక్కింగ్‌కు వెళ్లడానికి తల్లిదండ్రుల అనుమతి కోరింది. వారు వెళ్లవచ్చని, అయితే బాధ్యతగా ప్రవర్తించాలని, తనకు లేదా ఇతరులకు ఇబ్బంది కలిగించే పనులు చేయకూడదని చెప్పారు. ఇది ఏ రకమైన పిల్లల పెంపకం విధానం?",opts:["పట్టించుకోని విధానం","అధికారవాద విధానం","అనుమతించే విధానం","అధికారయుత విధానం"],correct:3,exp:"స్వేచ్ఛతో పాటు బాధ్యత, స్పష్టమైన పరిమితులు విధించడం అధికారయుత (Authoritative) పెంపకం విధానం."},
{q:"చిత్రకు అసైన్‌మెంట్ సమర్పించనందుకు ఉపాధ్యాయుడు మార్కులు ఇవ్వలేదు. ఇంటికి వెళ్లాక, తండ్రి బస్‌స్టాప్ వద్ద దింపకపోవడంతో పుస్తకం మరిచిపోయానని తల్లికి చెప్పింది. చిత్ర ఉపయోగించిన రక్షణ యంత్రాంగం ఏది?",opts:["స్థానభ్రంశం","హేతుబద్ధీకరణ","అణచివేత","పరిహారం"],correct:1,exp:"తన ప్రవర్తనకు సమర్థన చూపడాన్ని హేతుబద్ధీకరణ (Rationalization) అంటారు."},
{q:"కాజల్ ఏడో తరగతి విద్యార్థుల సామాజిక అభివృద్ధిని అధ్యయనం చేయాలనుకుంది. కొంతమంది పిల్లల జీవితాల్లో జరిగిన సంఘటనల గురించి తల్లిదండ్రులు, ఉపాధ్యాయులు, తోటి విద్యార్థుల నుంచి నివేదికలు సేకరించింది. ఆమె సేకరించిన నివేదికలు ఏవి?",opts:["ప్రశ్నావళి","వ్యక్తిత్వ వివరణ పట్టిక","సంఘటనాత్మక రికార్డులు","ముఖాముఖి"],correct:2,exp:"ప్రత్యేక సంఘటనలను వివిధ వ్యక్తుల నుంచి సేకరించి నమోదు చేయడం సంఘటనాత్మక రికార్డుల (Anecdotal Records) లక్షణం."},
{q:"సంతృప్తి చెందాల్సిన అవసరం ఉన్నప్పుడు అభ్యసన లక్ష్యాలు దేనిని ఆధారంగా చేసుకుని నిర్ణయించబడతాయి?",opts:["ప్రేరకాలు","అడ్డంకులు","జ్ఞానం","పునర్బలనం"],correct:0,exp:"PDF సమాధాన సూచిక ప్రకారం సరైన సమాధానం ప్రేరకాలు."},
{q:"అభ్యసనాన్ని ప్రభావితం చేసే అభ్యాసకుడి శారీరక లేదా మానసిక ఆరోగ్యానికి సంబంధించిన ఉదాహరణలను గుర్తించండి.\nA) తల్లి నుంచి విడిపోవడం వల్ల మానసికంగా కలత చెందిన బాలుడు\nB) ప్రమాదంలో గాయపడిన బాలుడు\nC) సాధారణ జలుబుతో బాధపడుతున్న బాలుడు\nD) దీర్ఘకాలిక వ్యాధితో బాధపడుతున్న బాలుడు",opts:["A, B మరియు C మాత్రమే","A, B మరియు D మాత్రమే","B, C మరియు D మాత్రమే","A, B, C మరియు D"],correct:3,exp:"PDF సమాధాన సూచిక ప్రకారం A, B, C, D అన్నీ అభ్యసనాన్ని ప్రభావితం చేసే ఉదాహరణలు."},
{q:"శ్రవణ్ తన రెండేళ్ల కుమార్తెను స్విమ్మింగ్ పూల్‌లో ట్యూబ్‌పై కూర్చోబెట్టాడు. భయపడి ఏడ్చిన ఆమెను బయటకు తీసిన తర్వాత, చాలా సంవత్సరాల వరకు మళ్లీ పూల్‌లోకి వెళ్లలేకపోయింది. థార్న్‌డైక్ అభ్యసన సిద్ధాంతం ప్రకారం దీనిని ఏ నియమం వివరిస్తుంది?",opts:["సంసిద్ధతా నియమం","వివిధ ప్రతిస్పందనల నియమం","అభ్యాస నియమం","ఉపయోగ నియమం"],correct:0,exp:"PDF సమాధాన సూచిక ప్రకారం సరైన సమాధానం సంసిద్ధతా నియమం."},
{q:"యాదవ్ తన ఇంట్లో తినే ఆహారానికి భిన్నమైన స్థానిక ఆహారాన్ని మొదటిసారి రుచి చూశాడు. ఆ రుచి నచ్చక, తర్వాత అలాంటి ఇతర స్థానిక ఆహారాలనూ తినడానికి ఇష్టపడలేదు. క్లాసికల్ కండిషనింగ్‌లో ఉద్దీపన సాధారణీకరణ ప్రకారం, ఈ ఉదాహరణలో ఏది షరతుబద్ధ ప్రతిస్పందన?",opts:["షరతులేని ఉద్దీపన","షరతులేని ప్రతిస్పందన","షరతుబద్ధ ఉద్దీపన","షరతుబద్ధ ప్రతిస్పందన"],correct:3,exp:"PDF సమాధాన సూచిక ప్రకారం సరైన సమాధానం షరతుబద్ధ ప్రతిస్పందన."},
{q:"యువిక సంప్రదాయ కుటుంబానికి చెందినది. పెద్దలను గౌరవించడం నేర్పడానికి మొదట కుమార్తెతో పెద్దలకు నమస్కారం చేయించింది. ఆ తర్వాత దశలవారీగా పెద్దల అవసరాలను గుర్తించి సహాయం చేసేలా ప్రోత్సహించింది. స్కిన్నర్ ప్రకారం ప్రవర్తనను నిర్మించే ఈ పద్ధతి ఏది?",opts:["ఆకృతి కల్పన","శృంఖలీకరణ","సూచన","వివక్ష"],correct:0,exp:"ప్రవర్తనను చిన్న చిన్న దశలుగా క్రమంగా అభివృద్ధి చేయడాన్ని ఆకృతి కల్పన (Shaping) అంటారు."},
{q:"కింది ఉదాహరణల్లో వైగోట్స్కీ ప్రతిపాదించిన ‘సమీప అభివృద్ధి మండలం’ (Zone of Proximal Development) పరిజ్ఞానాన్ని సూచించేవి ఏవో గుర్తించండి.\nA) రమణి తన కుమార్తె ఏ పనిలోనూ విఫలం కాకూడదని, ఆమెకు సులభమైన పనులనే ఇస్తుంది.\nB) రాగిణి తన కుమార్తెకు చాలా కష్టమైన పనులను ఇస్తుంది; వాటిని చేయలేక ఆమె నిరాశకు గురవుతుంది.\nC) రజిని తన కుమార్తెకు కొంతకాలం తర్వాత పరిచయం చేయబోయే పనులను ముందుగానే అలవాటు చేస్తూ, కొత్త పనులను నేర్చుకోవడంలో సహాయం చేస్తుంది.",opts:["A, B మరియు C","A మాత్రమే","B మాత్రమే","C మాత్రమే"],correct:3,exp:"సమీప అభివృద్ధి మండలంలో అభ్యాసకుడు సహాయంతో చేయగలిగే పనులకు మద్దతు ఇవ్వడం ముఖ్యం. PDF సూచిక ప్రకారం C మాత్రమే."},
{q:"దోమల బెడదను ఎలా ఎదుర్కోవాలో రాయమని ఉపాధ్యాయురాలు విద్యార్థికి అసైన్‌మెంట్ ఇచ్చింది. ఈ అసైన్‌మెంట్‌లో ప్రధానంగా ఏ అభ్యసన రంగం ఉంటుంది?",opts:["మానసిక చలనాత్మక రంగం","జ్ఞానాత్మక రంగం","భావాత్మక రంగం","చలనాత్మక రంగం"],correct:1,exp:"రాయడం, సమాచారం తెలుసుకోవడం, ఆలోచించడం వంటి అంశాలు జ్ఞానాత్మక రంగానికి చెందుతాయి."},
{q:"చంద్రిక మరియు ఆమె స్నేహితులు ఒక పార్టీకి వెళ్లారు. ఒక వ్యక్తి పదేపదే వారి దగ్గరకు వచ్చి ఇబ్బంది పెట్టాడు. ‘మమ్మల్ని ఎందుకు ఇబ్బంది పెడుతున్నారు?’ అని అడిగినప్పుడు, ‘ఎందుకు’ అనే పదం ఆ వ్యక్తిలోని దేనిని సూచిస్తుంది?",opts:["ఉద్వేగం","అవసరం","ప్రేరకం","కోరిక"],correct:2,exp:"ఒక ప్రవర్తన వెనుక పనిచేసే కారణం లేదా ప్రేరేపించే అంశాన్ని ప్రేరకం అంటారు."},
{q:"అణచివేత (Repression) అనేది ఎలాంటి ప్రవర్తన లేదా ప్రక్రియ?",opts:["సహజమైనది","అసాధారణమైనది","సాధారణమైనది","జీవసంబంధమైనది"],correct:1,exp:"PDF సమాధాన సూచిక ప్రకారం సరైన సమాధానం అసాధారణమైనది."},
{q:"విభిన్న అభ్యసన పరిస్థితుల మధ్య సాధారణీకరణలను నిర్మించుకోవడం దేనికి సహాయపడుతుంది?",opts:["ప్రతికూల అభ్యసన బదిలీ","శూన్య అభ్యసన బదిలీ","సానుకూల అభ్యసన బదిలీ","తాత్కాలిక అభ్యసన బదిలీ"],correct:2,exp:"ఒక సందర్భంలో నేర్చుకున్నది మరో సందర్భంలో ఉపయోగపడితే దాన్ని సానుకూల అభ్యసన బదిలీ అంటారు."}
];

const quiz=document.getElementById('quiz');

questions.forEach((q,i)=>{
 const card=document.createElement('section');
 card.className='card';
 card.id='q'+i;
 const title=document.createElement('h3');
 title.className='question';
 title.textContent=(i+1)+'. '+q.q;
 card.appendChild(title);
 q.opts.forEach((op,j)=>{
  const label=document.createElement('label');
  label.className='option';
  const input=document.createElement('input');
  input.type='radio';
  input.name='q'+i;
  input.value=j;
  input.addEventListener('change',()=>check(i,j));
  label.appendChild(input);
  label.appendChild(document.createTextNode(' '+String.fromCharCode(65+j)+') '+op));
  card.appendChild(label);
 });
 const fb=document.createElement('div');
 fb.className='feedback';
 fb.id='fb'+i;
 card.appendChild(fb);
 quiz.appendChild(card);
});

function check(i,j){
 const q=questions[i],fb=document.getElementById('fb'+i);
 const inputs=document.querySelectorAll('input[name="q'+i+'"]');
 inputs.forEach(x=>x.disabled=true);
 const ok=j===q.correct;
 fb.style.display='block';
 fb.className='feedback '+(ok?'correct':'wrong');
 fb.textContent=(ok?'సరైన సమాధానం! ':'తప్పు సమాధానం. సరైన సమాధానం: '+String.fromCharCode(65+q.correct)+') '+q.opts[q.correct]+'. ')+q.exp;
 document.getElementById('progress').textContent='సమాధానాలు: '+document.querySelectorAll('input:checked').length+'/30';
}

function finishQuiz(){
 let answered=0,score=0;
 questions.forEach((q,i)=>{
  const chosen=document.querySelector('input[name="q'+i+'"]:checked');
  if(chosen){
   answered++;
   if(Number(chosen.value)===q.correct)score++;
  }
 });
 document.getElementById('result').textContent='మీ స్కోర్: '+score+'/30';
 document.getElementById('summary').textContent='సమాధానాలు ఇచ్చినవి: '+answered+'/30 | సరైనవి: '+score+' | తప్పైనవి: '+(answered-score)+' | సమాధానం ఇవ్వనివి: '+(30-answered);
 document.getElementById('submit').disabled=true;
 document.getElementById('result').scrollIntoView({behavior:'smooth',block:'center'});
}
</script>
