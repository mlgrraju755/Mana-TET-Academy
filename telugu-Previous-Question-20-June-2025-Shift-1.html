<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANA-TET-2026 | తెలుగు ప్రశ్నలు 31–60</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#202124;font-family:"Noto Sans Telugu","Gautami","Nirmala UI",Arial,sans-serif;line-height:1.7}
.header{background:linear-gradient(135deg,#123c69,#1d70a2);color:#fff;text-align:center;padding:22px 14px}
.header h1{margin:0;font-size:27px;letter-spacing:.4px}
.header p{margin:5px 0 0;font-size:16px}
.wrap{max-width:900px;margin:20px auto;padding:0 12px}
.progress-box{position:sticky;top:0;z-index:5;background:#fff;padding:12px 15px;margin-bottom:16px;border-radius:12px;box-shadow:0 2px 9px #00000012}
.progress-top{display:flex;justify-content:space-between;gap:10px;font-weight:700;color:#123c69}
.progress-track{height:9px;background:#e5eaf1;border-radius:20px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;width:0;background:#16a085;transition:width .2s}
.card{background:#fff;border-radius:13px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0000000d;border-left:5px solid #1d70a2}
.passage{background:#fff8e7;border-left:5px solid #e0a326;border-radius:12px;padding:16px 18px;margin:18px 0;color:#343434}
.passage h3{margin:0 0 8px;color:#8a5b00;font-size:18px}
.passage p{margin:5px 0;white-space:pre-line}
.qtitle{font-weight:700;color:#123c69;font-size:18px;margin:0 0 12px}
.option{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;margin:8px 0;border:1px solid #dce3eb;border-radius:9px;cursor:pointer;transition:.15s}
.option:hover{background:#f3f8fc;border-color:#78a9cc}
.option input{margin-top:7px;accent-color:#176b9a;flex-shrink:0}
.option.correct{background:#e7f7ed;border-color:#27ae60;color:#126b35}
.option.wrong{background:#fff0f0;border-color:#e05252;color:#a32222}
.feedback{font-weight:700;margin-top:10px;min-height:26px}
.feedback.good{color:#168044}.feedback.bad{color:#c0392b}
.actions{text-align:center;margin:24px 0}
button{border:0;border-radius:9px;padding:12px 24px;font-size:16px;font-weight:700;cursor:pointer;margin:5px}
#finishBtn{background:#123c69;color:#fff}
#restartBtn{background:#16a085;color:#fff;display:none}
#result{display:none;background:#fff;border-radius:14px;padding:22px;margin:20px 0;text-align:center;box-shadow:0 3px 14px #00000012}
#result h2{color:#123c69;margin-top:0}
.score{font-size:30px;font-weight:800;color:#16a085}
.result-grid{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.result-item{background:#f3f6fb;border-radius:10px;padding:10px 18px;min-width:110px}
.result-item b{display:block;font-size:22px;color:#123c69}
.note{font-size:13px;color:#666;text-align:center;margin:20px}
@media(max-width:600px){.header h1{font-size:23px}.card{padding:14px}.qtitle{font-size:17px}.wrap{padding:0 9px}}
</style>
</head>
<body>
<header class="header">
  <h1>MANA-TET-2026</h1>
  <p>TG TET Paper-I – తెలుగు భాష</p>
  <p>ప్రశ్నలు 31–60 | 20-06-2025 Shift-1</p>
</header>
<main class="wrap">
  <div class="progress-box">
    <div class="progress-top"><span>మీ ప్రగతి</span><span id="progressText">0 / 30 సమాధానాలు</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div id="quiz"></div>
  <div class="actions">
    <button id="finishBtn" onclick="finishTest()">పరీక్ష ముగించండి / ఫలితాలు చూడండి</button>
    <button id="restartBtn" onclick="restartTest()">మళ్లీ పరీక్ష రాయండి</button>
  </div>
  <section id="result">
    <h2>మీ పరీక్ష ఫలితాలు</h2>
    <div class="score" id="scoreText"></div>
    <div class="result-grid">
      <div class="result-item">సరైనవి<b id="correctCount">0</b></div>
      <div class="result-item">తప్పైనవి<b id="wrongCount">0</b></div>
      <div class="result-item">సమాధానం ఇవ్వనివి<b id="unansweredCount">0</b></div>
    </div>
  </section>
  <p class="note">MANA-TET-2026 | Practice makes progress</p>
</main>
<script>

{n:35,q:"చూడడం ద్వారా అనుభూతిని పొందే కళ",o:["శిల్పం","కవిత్వం","సంగీతం","భాషణం"],a:0},
{n:36,q:"శ్రవ్య కళలు అంటే",o:["చూడడం ద్వారా అనుభూతిని పొందడం","వినడం ద్వారా అనుభూతిని పొందడం","ఆడడం ద్వారా అనుభూతిని పొందడం","అక్కడం ద్వారా అనుభూతిని పొందడం"],a:2},
{n:37,q:"దృశ్య, శ్రవ్య కళల సమాహారం",o:["కవిత్వం","సంగీతం","శిల్పం","నాట్యం"],a:3},
{n:38,q:"కాలానుబంధితో అనుభూతిని పొందే కళలు",o:["దృశ్య కళలు","శ్రవ్య కళలు","ఉభయ కళలు","ఉదయ కళలు"],a:1},
{n:39,q:"రాము అన్నం తిన్నాడు. రాము బడికి వచ్చాడు. ఒకే వాక్యంగా రాస్తే",o:["రాము అన్నం తిన్నాడు. బడికి వచ్చాడు.","రాము అన్నం తిన్నాడు రాము బడికి రాలేదు.","రాము అన్నం తిని, బడికి వచ్చాడు.","రాము అన్నం తిని, రాము బడికి వచ్చాడు."],a:2},
{n:40,q:"‘అత్యద్భుతం’ అంటే",o:["లింగ, వచన, విభక్తులు లేనిది.","లింగ, వచన, విభక్తులు కలిగినది.","నామవాచకానికి బదులుగా వచ్చేది.","పనిని తెలిపేది."],a:0},
{n:41,q:"చేతి, కై, శిరస్సు, లో అనే ప్రత్యయాలు కలిగిన విభక్తి",o:["ప్రథమా విభక్తి","ద్వితీయా విభక్తి","తృతీయా విభక్తి","చతుర్థీ విభక్తి"],a:2},

{n:52,q:"‘యుద్ధగానాలు’ అనే వీరి రచనలు అడవారిని ఏమంటారు?",o:["జానపదులు","భాగోతులు","శారదాకాండ్రు","కథకులు"],a:0},

{n:56,q:"సామాజిక సంస్కరణ స్థాయిలోనున్న మార్పు, ఆ స్థాయిని అధిగమించి ఉన్నత వైజ్ఞానిక స్థాయికి అందుకొనడమే",o:["సామాజికీకరణం","వైజ్ఞానికీకరణం","సామాజికీకరణం","మానవీకరణం"],a:1},
{n:57,q:"విద్యార్థుల భాషా నైపుణ్యాన్ని పెంపొందించేందుకు ఉపాధ్యాయునికి అవసరమైన పాఠంలో ఒకటి",o:["వాస్తవతనం","సమీక్ష","కథాత్మకం","ప్రయోగాత్మక"],a:2},
{n:58,q:"విద్యార్థుల కేవలం పాఠ్యపుస్తకం ద్వారా జరగదు. పాఠ్యపుస్తకం విద్యార్థుల విద్యాభ్యాసానికి ఉపయోగించే ఒక",o:["ఆలోచన మాత్రమే","ఉపాధ్యాయుని మాత్రమే","కళ మాత్రమే","పరికరం మాత్రమే"],a:3},

const quiz=document.getElementById("quiz");
let answers={};
function addPassage(title,desc,body){const d=document.createElement("div");d.className="passage";d.innerHTML=`<h3>${title}</h3><p>${desc}</p><p>${body}</p>`;quiz.appendChild(d)}
function render(){
 quiz.innerHTML="";
 questions.forEach((item,i)=>{
  if(item.n===31)addPassage("ప్రశ్నలు 31–34కు సంబంధించిన పద్యం","ఈ క్రింది పద్యాన్ని చదివి 31 నుండి 34 వరకు గల ప్రశ్నలకు సరైన సమాధానాలను గుర్తించండి.","వరదను చేసిన దున్నపునకు\nకరుణను బంధుముల కడ కేకసేమి\nపరులకు మురుగు నెప్పునకు\nపిరికికి దళవాయితనము పెట్టకు సుమతీ!");
  if(item.n===35)addPassage("ప్రశ్నలు 35–38కు సంబంధించిన గద్యభాగం","ఈ క్రింది గద్యభాగాన్ని చదివి 35 నుండి 38 వరకు గల ప్రశ్నలకు సరైన సమాధానాలను గుర్తించండి.","లలిత కళలు రెండు రకాలు. ఒకటి దృశ్య కళలు, రెండవది శ్రవ్య కళలు. చిత్రకళ, శిల్పకళలు అనుభూతిని చూపు ద్వారా సృజిస్తాయి. కాబట్టి అవి దృశ్యకళలు. సంగీతం, కవిత్వములు శ్రవ్య కళలు. నాట్యకళ ఉభయ ప్రయోజనాత్మకమైనది. మహాకవి కాళిదాసు “రఘువంశం” వంటి కావ్యాలలో ఈ విషయాన్ని కళాత్మకంగా నిరూపించాడు. దృశ్యకళానుభవం విశేషమయినది. శ్రవ్యకళానుభవం ఆహ్లాదకరమైనది. వాటికి కొంత కాలానుభవం అవసరం. అందువల్ల శ్రవ్యకళలను కాలానుబంధి కళలని, దృశ్యకళలను స్థలానుబంధి కళలని అంటారు.");
  const card=document.createElement("section");card.className="card";card.id="q"+item.n;
  const opts=item.o.map((op,j)=>`<label class="option" id="opt-${item.n}-${j}"><input type="radio" name="q${item.n}" value="${j}" onchange="choose(${item.n},${j})"><span>${j+1}. ${op}</span></label>`).join("");
  card.innerHTML=`<p class="qtitle">ప్రశ్న ${item.n}. ${item.q}</p><div>${opts}</div><div class="feedback" id="fb-${item.n}" aria-live="polite"></div>`;
  quiz.appendChild(card);
 });
 updateProgress();
}
function choose(n,j){
 if(answers[n]!==undefined)return;
 answers[n]=j;
 const item=questions.find(x=>x.n===n);
 const fb=document.getElementById("fb-"+n);
 item.o.forEach((_,k)=>{
  const lab=document.getElementById(`opt-${n}-${k}`);
  const radio=lab.querySelector("input");radio.disabled=true;
  if(k===item.a)lab.classList.add("correct");
  if(k===j && j!==item.a)lab.classList.add("wrong");
 });
 fb.textContent=j===item.a?"✓ సరైన సమాధానం!":"✗ తప్పు సమాధానం. సరైన సమాధానం: "+(item.a+1)+". "+item.o[item.a];
 fb.className="feedback "+(j===item.a?"good":"bad");
 updateProgress();
}
function updateProgress(){
 const count=Object.keys(answers).length;
 document.getElementById("progressText").textContent=count+" / 30 సమాధానాలు";
 document.getElementById("progressFill").style.width=(count/30*100)+"%";
}
function finishTest(){
 const correct=questions.filter(q=>answers[q.n]===q.a).length;
 const wrong=questions.filter(q=>answers[q.n]!==undefined&&answers[q.n]!==q.a).length;
 const unanswered=30-correct-wrong;
 document.getElementById("scoreText").textContent=correct+" / 30";
 document.getElementById("correctCount").textContent=correct;
 document.getElementById("wrongCount").textContent=wrong;
 document.getElementById("unansweredCount").textContent=unanswered;
 document.getElementById("result").style.display="block";
 document.getElementById("restartBtn").style.display="inline-block";
 document.getElementById("finishBtn").style.display="none";
 document.getElementById("result").scrollIntoView({behavior:"smooth"});
}
function restartTest(){
 answers={};document.getElementById("result").style.display="none";
 document.getElementById("restartBtn").style.display="none";
 document.getElementById("finishBtn").style.display="inline-block";
 render();window.scrollTo({top:0,behavior:"smooth"});
}
render();
</script>
