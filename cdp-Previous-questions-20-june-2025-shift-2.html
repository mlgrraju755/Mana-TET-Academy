<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#202124;font-family:"Noto Sans Telugu","Gautami","Nirmala UI",Arial,sans-serif;line-height:1.65}
header{background:linear-gradient(135deg,#123b78,#1769aa);color:#fff;padding:22px 16px;text-align:center}

.option{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:8px 0;border:1px solid #dce3ed;border-radius:9px;cursor:pointer;background:#fff}

<body>
<header>
<h1>MANA-TET-2026</h1>
<p>మనా TET – మన టెస్ట్ | శిశు వికాసం మరియు బోధనా శాస్త్రం</p>
<p>తెలుగు మీడియం • ప్రశ్నలు 1 నుండి 30 వరకు</p>
</header>
<div class="wrap">
<div class="topbox">
<div id="progressText">సమాధానాలు: 0 / 30</div>
<div class="progressline"><div id="progressBar"></div></div>
<div>ప్రతి ప్రశ్నకు సరైన సమాధానాన్ని ఎంచుకోండి. సమాధానం ఎంచుకున్న వెంటనే ఫలితం కనిపిస్తుంది.</div>
</div>
<div id="quiz"></div>
<div class="actions">
<button id="finishBtn" onclick="finishQuiz()">పరీక్ష ముగించండి / ఫలితాలు చూడండి</button>
<button id="restartBtn" onclick="restartQuiz()">మళ్లీ ప్రారంభించండి</button>
</div>
<div id="result"></div>
<p class="note">MANA-TET-2026 | Practice Test</p>
</div>
<script>
const questions = [
{q:"వికాసం ఒకే వేగంతో సాగదు మరియు వైయక్తిక భేదాలు కనిపిస్తాయి కాని పాఠశాలలు తరగతి వారీగా ఒకే విధమైన విద్యాప్రణాళికను అనుసరిస్తాయి ఎందుకంటే",o:["పాఠశాలల్లో వైయక్తిక భేదాలను పరిష్కరించలేము","వికాసం మొత్తం నుండి భాగాలకు, భాగాల నుండి మొత్తానికి కొనసాగుతుంది","వికాసం ఒక నిర్దిష్ట నమూనాను అనుసరిస్తుంది","వికాసాన్ని అంచనా వేయలేము"],a:2},
{q:"కింది స్టేట్మెంట్‌ను చదివి సరైన సమాధానాన్ని గుర్తించండి:<br>A) పరిపక్వత చెందే సమయంలో తగిన శిక్షణ అందించడం వల్ల ఆశించిన విజయం సాధించడంలో సహాయపడుతుంది.<br>B) మన జాతీయ విద్యా విధానం, 2020 గ్రేడ్ 1 లో ప్రవేశ వయస్సు ఆరు సంవత్సరాలుగా సిఫార్సు చేసింది.",o:["స్టేట్మెంట్ A సరికాదు","స్టేట్మెంట్లు A మరియు B రెండూ సరైనవి మరియు A, B కి సరైన వివరణ ఇవ్వడం లేదు","A మరియు B రెండు స్టేట్మెంట్లు సరికావు","స్టేట్మెంట్లు A మరియు B రెండూ సరైనవి మరియు A, B కి సరైన వివరణను అందిస్తుంది"],a:1},
{q:"కింది వానిలో మానసిక వికాసానికి ప్రాథమిక కారకం",o:["తల్లిదండ్రుల విద్య","నాడీ వ్యవస్థ యొక్క అవయవ పెరుగుదల","బహుమతులు మరియు శిక్ష","చదివిన పాఠశాల"],a:1},
{q:"వికాస కృత్యాలు వికాసం చెందుతున్న పిల్లవాడి నుండి ఇవి ఆశించుటకు సంబంధించినవి.<br>A) చేయడం<br>B) ఆలోచించడం<br>C) అనుభూతి చెందడం<br>సరైన సమాధానాన్ని ఎంచుకోండి:",o:["A, B & C","A & C మాత్రమే","B & C మాత్రమే","A & B మాత్రమే"],a:0},
{q:"కోల్బర్గ్ ప్రకారం, నైతిక తీర్పులు ఈ నైతిక వికాస స్థాయిలో అధికంగా అంతర్గతీకరించబడతాయి",o:["VI","II","I","IV"],a:0},
{q:"శైశవులకు అందించాల్సిన అనుభవాలు దీనికి సంబంధించినవి అయితే సముచితంగా ఉంటాయి",o:["తార్కిక వివేచన","ఇంద్రియ అన్వేషణ","అమూర్త ఆలోచన","ప్రతీకాత్మక వ్యక్తీకరణ"],a:1},
{q:"వైయక్తిక భేదాలు ప్రతి వ్యక్తిని ఇలా అర్థం చేసుకోవడానికి మనకు సహాయపడతాయి",o:["సుపరిచితంగా","సాధారణంగా","స్థిరంగా","ప్రత్యేకంగా"],a:3},
{q:"స్వీయ భావన వ్యక్తీకరణ కాని ఉదాహరణను గుర్తించండి",o:["నాకు సిగ్గు","నేను బలంగా ఉన్నాను","నేను పాఠశాలకు వెళ్తాను","నేను దేవుడికి భయపడతాను"],a:2},
{q:"ఈ క్రింది వాటిలో పిల్లలలో 'అబద్ధం చెప్పే' ప్రవర్తన చికిత్సలో మొదటి చర్య కాకూడనిది",o:["క్రీడా స్ఫూర్తిని పెంపొందించడం","శిక్ష","ఆదర్శవంతమైన కథలను చెప్పడం","నిజాయితీ యొక్క మొదటి సంకేతానికి బహుమానం ఇవ్వడం"],a:1},
{q:"ఈ క్రింది పద్ధతుల్లో, ఒకదానిలో ప్రతిస్పందనలను అధ్యయనం చేయబడుతున్న వ్యక్తి నుండి నేరుగా తీసుకుంటారు మరియు ప్రతిస్పందనలను కూడా నియంత్రించవచ్చు",o:["పరిశీలన","పరిపృచ్ఛ","ప్రక్షేపక విధానం","ప్రయోగం"],a:3},
{q:"అభ్యసనానికి సంబంధించి సరికాని స్టేట్మెంట్‌ను గుర్తించండి",o:["అభ్యసనం సహజమైన ప్రక్రియ కాదు","అభ్యసనం సార్వత్రికమైనది, నిరంతరమైనది","అభ్యసనంలో వివిధ రకాలు ఉన్నాయి","అభ్యసనం ప్రవర్తనలో మార్పులకు దారితీస్తుంది"],a:0},
{q:"అభ్యసనంలో సరైన పరిపుష్టిని మరియు పునర్బలనాన్ని అందించడం అనేది దీనికి సంబంధించిన కారకం",o:["విషయం","అభ్యాసకుడు","ప్రక్రియ","క్రమశిక్షణ"],a:2},
{q:"సుచరితకు నాలుగేళ్ల కూతురు ఉంది. ఆమె కూతురు ఏదైనా సరిగ్గా చేసినప్పుడు తన అభ్యసనాన్ని బలోపేతం చేయడానికి 'బాగా చేసావు' అని చెబుతుంది మరియు ఆమె కూతురు అది విన్నప్పుడల్లా ఉత్సాహపడుతుంది. ఇది థార్న్‌డైక్ యొక్క ఈ అభ్యసన నియమానికి అనుగుణంగా ఉంది",o:["ఫలిత నియమం","సంసిద్ధత నియమం","అభ్యాస నియమం","సహసంబంధ నియమం"],a:0},
{q:"శాస్త్రీయ నిబంధన ప్రకారం, అవాంఛనీయ ప్రవర్తనను క్రమంగా మార్చడానికి ఉపయోగించాల్సిన అభ్యసన నియమం",o:["సంసిద్ధత","అయత్న సిద్ధ స్వాస్థ్యము","విరమణ","అభ్యాసము"],a:2},
{q:"కవిత పాఠశాలలో మరియు పాఠశాల వెలుపల అనేక క్విజ్ పోటీలలో పాల్గొంటుంది, ఎందుకంటే ఆమె తల్లి ప్రతి 4వ విజయానికి ఆమెకు ఒక బహుమతి కొంటుంది. ఇక్కడ అనుసరించబడిన పునర్బలన నియమం",o:["చరశీల పునర్బలన నియమం","స్థిర కాల వ్యవధి పునర్బలన నియమం","నిరంతర పునర్బలన నియమం","స్థిర నిష్పత్తి పునర్బలన నియమం"],a:3},
{q:"ప్రత్యక్ష క్షేత్రం మరియు అభ్యసన సామగ్రిని ఈ రూపంలో వ్యవస్థీకరించడం అంతర్ దృష్టి అభ్యసన సిద్ధాంతానికి అవసరం",o:["యాంత్రిక సోపానాలు","వివిక్త వాస్తవాలు","సంబంధం లేని ప్రవర్తనా చర్యలు","మొత్తం"],a:3},
{q:"మిమీ తన తండ్రిని సముద్రంలో ఈత కొట్టడానికి వెళ్లామని అడిగింది. సముద్రంలో ఈత కొట్టడం వల్ల కలిగే ప్రమాదాలను ఆమె తండ్రి ఆమెకు వివరించాడు. ఇది దీనికి సంబంధించిన అభ్యసనం",o:["భావావేశ","సంజ్ఞానాత్మక","చలనాత్మక","మానసిక చలనాత్మక"],a:1},
{q:"వశిష్ట అనే పదేళ్ల బాలుడు చాలా మంచి కళాత్మక పని చేస్తాడు. కుటుంబంలో లేదా స్నేహితులలో ఎవరిదైనా పుట్టినరోజు లేదా ప్రత్యేక రోజు వచ్చినప్పుడు అతను అందమైన గ్రీటింగ్ కార్డులను తయారు చేస్తాడు, ఎందుకంటే అది అతనికి అపారమైన ఆనందాన్ని ఇస్తుంది. ఇది దీనికి ఒక ఉదాహరణ",o:["అసహజ ప్రేరణ","బాహ్య ప్రేరణ","అంతర్గత ప్రేరణ","సాధన ప్రేరణ"],a:2},
{q:"రింకీ జంతు ప్రేమికురాలు. ఆమె తండ్రి ఆమెను దేశంలో మరియు ఇతర దేశాలలో ఉన్న అనేక జూలాజికల్ పార్కులకు తీసుకెళ్లాడు. ఆ జూలాజికల్ పార్కులలోని జంతువుల గురించి ఎవరైనా ఆమెను అడిగినప్పుడు, ఆమె వాటి గురించి ఎటువంటి లోపం లేకుండా చెబుతుంది. ఈ ఉదాహరణ దీనిని సూచిస్తుంది",o:["సెమాంటిక్ స్మృతి","ఎపిసోడిక్ స్మృతి","తాత్కాలిక స్మృతి","అసాధారణ స్మృతి"],a:0},

{q:"కింది వాటిలో, ప్రమాణ నిర్దేశిత పరీక్షకు ఉదాహరణను గుర్తించండి",o:["UGC NET","NEET","TET","EAMCET"],a:2},
{q:"ఈ క్రింది వాటిలో, ఏ రకమైన పిల్లల దుర్వినియోగం సామాజిక దుర్వినియోగం కిందకు వస్తుంది?<br>A) శిశుహత్య<br>B) బాల్య వివాహం<br>C) బాల వ్యభిచారం<br>D) బాల బిక్షాటన<br>E) బాల కార్మికులు<br>సరైన సమాధానాన్ని ఎంచుకోండి:",o:["C, D & E మాత్రమే","B, C, D & E మాత్రమే","B, C & D మాత్రమే","A, B, C, D & E"],a:1},

{q:"తన విద్యార్థులకు సలహా ఇవ్వకుండా, ప్రశంసించకుండా లేదా విమర్శించకుండా వారి స్వంతానికి వదిలివేసే ఉపాధ్యాయురాలి నాయకత్వ శైలి",o:["లైసెజ్ ఫెయిర్","అధికారయుత","అధికారపూర్వక","ప్రజాస్వామ్య"],a:0},

const quiz=document.getElementById('quiz');
let answered=new Set(), score=0, finished=false;
function render(){
 quiz.innerHTML='';
 questions.forEach((item,i)=>{
  const card=document.createElement('section');card.className='question-card';card.id='q'+i;
  const head=document.createElement('div');head.className='qhead';head.innerHTML=(i+1)+'. '+item.q;card.appendChild(head);
  item.o.forEach((opt,j)=>{
   const label=document.createElement('label');label.className='option';label.id=`opt-${i}-${j}`;
   label.innerHTML=`<input type="radio" name="q${i}" value="${j}" onchange="chooseAnswer(${i},${j})"><span>${String.fromCharCode(65+j)}) ${opt}</span>`;
   card.appendChild(label);
  });
  const fb=document.createElement('div');fb.className='feedback';fb.id='fb'+i;card.appendChild(fb);quiz.appendChild(card);
 });
 updateProgress();
}
function chooseAnswer(i,j){
 if(answered.has(i)||finished)return;
 answered.add(i);
 const correct=questions[i].a;
 document.querySelectorAll(`input[name="q${i}"]`).forEach(x=>x.disabled=true);
 document.getElementById(`opt-${i}-${correct}`).classList.add('correct');
 const fb=document.getElementById('fb'+i);fb.classList.add('show');
 if(j===correct){score++;fb.classList.add('good');fb.textContent='సరైన సమాధానం!';}
 else{document.getElementById(`opt-${i}-${j}`).classList.add('wrong');fb.classList.add('bad');fb.textContent='తప్పు సమాధానం. సరైన సమాధానం: '+String.fromCharCode(65+correct)+') '+questions[i].o[correct];}
 updateProgress();
}
function updateProgress(){
 document.getElementById('progressText').textContent=`సమాధానాలు: ${answered.size} / ${questions.length}`;
 document.getElementById('progressBar').style.width=(answered.size/questions.length*100)+'%';
}
function finishQuiz(){
 finished=true;
 document.querySelectorAll('input[type=radio]').forEach(x=>x.disabled=true);
 const unanswered=questions.length-answered.size;
 const result=document.getElementById('result');result.style.display='block';
 result.innerHTML=`<h2>మీ పరీక్ష ఫలితాలు</h2><p style="font-size:22px;font-weight:bold;color:#16834a">${score} / ${questions.length}</p><p>సరైన సమాధానాలు: ${score}</p><p>తప్పు సమాధానాలు: ${answered.size-score}</p><p>సమాధానం ఇవ్వని ప్రశ్నలు: ${unanswered}</p><p>శాతం: ${(score/questions.length*100).toFixed(2)}%</p>`;
 document.getElementById('finishBtn').style.display='none';
 document.getElementById('restartBtn').style.display='inline-block';
 result.scrollIntoView({behavior:'smooth'});
}
function restartQuiz(){
 answered=new Set();score=0;finished=false;
 document.getElementById('result').style.display='none';
 document.getElementById('finishBtn').style.display='inline-block';
 document.getElementById('restartBtn').style.display='none';
 render();window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
