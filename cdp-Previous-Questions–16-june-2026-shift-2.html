    const quizContainer = document.getElementById('quiz-container');
    const userAnswers = new Array(quizData.length).fill(null);

    quizData.forEach((item, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = item.q;
        card.appendChild(qText);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        item.options.forEach((opt, oIndex) => {
            const label = document.createElement('label');
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `question_${qIndex}`;
            radio.value = oIndex;

            radio.addEventListener('change', () => {
                checkAnswer(qIndex, oIndex);
            });

            label.appendChild(radio);
            label.appendChild(document.createTextNode(opt));
            optionsDiv.appendChild(label);
        });

        card.appendChild(optionsDiv);

        const feedbackDiv = document.createElement('div');
        feedbackDiv.className = 'feedback';
        feedbackDiv.id = `feedback_${qIndex}`;
        card.appendChild(feedbackDiv);

        quizContainer.appendChild(card);
    });

    function checkAnswer(qIndex, selectedIndex) {
        userAnswers[qIndex] = selectedIndex;
        const item = quizData[qIndex];
        const correctIndex = item.answer;
        const feedbackDiv = document.getElementById(`feedback_${qIndex}`);
        
        feedbackDiv.style.display = 'block';
        if (selectedIndex === correctIndex) {
            feedbackDiv.className = 'feedback correct';
            feedbackDiv.innerHTML = '✔ Right Answer! (సరైన సమాధానం)';
        } else {
            feedbackDiv.className = 'feedback wrong';
            feedbackDiv.innerHTML = `✖ Wrong Answer! (తప్పు సమాధానం) <br><span style="color:#155724;">సరైన సమాధానం: ${item.options[correctIndex]}</span>`;
        }
    }

    function calculateFinalScore() {
        let score = 0;
        let answeredCount = 0;

        userAnswers.forEach((ans, index) => {
            if (ans !== null) {
                answeredCount++;
                if (ans === quizData[index].answer) {
                    score++;
                }
            }
        });

        const scoreBoard = document.getElementById('score-board');
        scoreBoard.style.display = 'block';
        scoreBoard.innerHTML = `
            మీ ఫైనల్ స్కోర్ (Final Score): <span style="color: #28a745;">${score} / ${quizData.length}</span><br>
            <span style="font-size: 0.7em; color: #555;">(ప్రయత్నించిన ప్రశ్నలు: ${answeredCount} / ${quizData.length})</span>
        `;
        scoreBoard.scrollIntoView({ behavior: 'smooth' });
    }
