<p class="small">గమనిక: ప్రతి ప్రశ్నకు ఒక సమాధానాన్ని ఎంచుకొని “సమాధానం తనిఖీ చేయండి” నొక్కండి. చివరలో మీ ఫలితాన్ని చూడవచ్చు.</p>

<script>

 D–ii", "A–iv, B–iii, C–i, D–ii", "A–iv, B–i, C–ii, D–iii"], "answer": 1}, {"number": 149, "question": "‘మొక్కలు మరియు జంతువులు’ అనే పాఠాన్ని పూర్తిచేసిన తరువాత, 5వ తరగతి విద్యార్థి తన పరిసరాలలో మొక్కలు పెంచడం, పాఠశాల తోటను అభివృద్ధి చేయడం, జంతువులు మరియు పక్షుల పట్ల ప్రేమ, సానుభూతి చూపించడం చేస్తున్నాడు. ఈ కృత్యంలో ప్రతిబింబించే విద్యా ప్రమాణం ఏది?", "options": ["సమకాలీన అంశాలపై ప్రతిస్పందన", "సమాచార నైపుణ్యాలు మరియు ప్రాజెక్టు పనులు", "ప్రశంస, సున్నితత్వం", "ప్రయోగాలు, క్షేత్ర పరిశీలనలు"], "answer": 2}, {"number": 150, "question": "పర్యావరణ అధ్యయనం (EVS) లో నిర్మాణాత్మక మూల్యాంకనంలో ప్రధానంగా కింది సాధనాలను ఉపయోగిస్తారు:\nA) స్లిప్ పరీక్షలు\nB) రాత పనులు\nC) పిల్లల భాగస్వామ్యం మరియు ప్రతిస్పందనలు\nD) ప్రాజెక్టు పనులు\nసరైన సమాధానాన్ని గుర్తించండి:", "options": ["A, B, C, D", "B, C, D మాత్రమే", "A, C, D మాత్రమే", "A, B, C మాత్రమే"], "answer": 0}];
let index=0, selected=Array(questions.length).fill(null), checked=Array(questions.length).fill(false);
const $=id=>document.getElementById(id);
function score(){return checked.reduce((s,v,i)=>s+(v&&selected[i]===questions[i].answer?1:0),0)}
function render(){
 const q=questions[index];
 $('counter').textContent=`ప్రశ్న ${q.number} / 150`;
 $('score').textContent=`స్కోరు: ${score()} / 30`;
 $('bar').style.width=((index+1)/questions.length*100)+'%';
 $('qmeta').textContent=`EVS – ప్రశ్న ${q.number}`;
 $('question').textContent=q.question;
 $('options').innerHTML='';
 q.options.forEach((op,i)=>{
  const label=document.createElement('label');
  label.className='option'+(selected[index]===i?' selected':'');
  if(checked[index]&&i===q.answer)label.classList.add('correct');
  if(checked[index]&&selected[index]===i&&i!==q.answer)label.classList.add('wrong');
  label.innerHTML=`<input type="radio" name="answer" ${selected[index]===i?'checked':''} ${checked[index]?'disabled':''}><span><b>${i+1}.</b> ${escapeHtml(op).replace(/\n/g,'<br>')}</span>`;
  label.addEventListener('click',()=>{if(!checked[index]){selected[index]=i;render();}});
  $('options').appendChild(label);
 });
 $('feedback').textContent=checked[index]?(selected[index]===q.answer?'✓ సరైన సమాధానం!':`✗ సరైన సమాధానం: ${q.answer+1}. ${q.options[q.answer]}`):'';
 $('prev').disabled=index===0;
 $('next').textContent=index===questions.length-1?'ఫలితం చూడండి':'తర్వాత →';
 $('check').disabled=checked[index]||selected[index]===null;
 $('grid').innerHTML='';
 questions.forEach((x,i)=>{
  const b=document.createElement('button');b.textContent=x.number;
  if(checked[i])b.classList.add('done');if(i===index)b.classList.add('active');
  b.onclick=()=>{index=i;render()};$('grid').appendChild(b);
 });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('check').onclick=()=>{if(selected[index]!==null){checked[index]=true;render();}};
$('prev').onclick=()=>{if(index>0){index--;render();}};
$('next').onclick=()=>{if(index<questions.length-1){index++;render();}else showResult();};
function showResult(){
 const total=score(), attempted=selected.filter(x=>x!==null).length;
 $('quiz').innerHTML=`<div class="result"><h2>మీ ఫలితం</h2><h1>${total} / 30</h1><p>సరైన సమాధానాలు: ${total}</p><p>తప్పు సమాధానాలు: ${checked.filter((v,i)=>v&&selected[i]!==questions[i].answer).length}</p><p>సమాధానం ఎంచుకున్నవి: ${attempted} / 30</p><h3>${Math.round(total/30*100)}%</h3><button class="primary" onclick="location.reload()">మళ్లీ పరీక్ష రాయండి</button></div>`;
}
render();
</script>
