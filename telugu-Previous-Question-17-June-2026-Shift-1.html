            q: "58. సంస్థాగత ప్రణాళిక ముఖ్య లక్షణాలలో సరియైన వానిని గుర్తించండి.\nA) పాఠశాలకు అవసరమైన ఆర్థిక, మానవశక్తి వనరులను సేకరించి సద్వినియోగం చేయడం\nB) పాఠశాలకు, సమాజానికి మధ్య సన్నిహిత సంబంధం ఏర్పరచడం\nC) పాఠశాల నిర్వహణలో ప్రజాస్వామ్య విలువలను పాటించడం\nD) గ్రామ ప్రజల, ఉపాధ్యాయుల ప్రయోజనాల పరిరక్షణ\nసరైన ఐచ్ఛికాన్ని గుర్తించండి.",
            options: [
                "1) A, B & C మాత్రమే",
                "2) B, C & D మాత్రమే",
                "3) A, B, C & D",
                "4) B & D మాత్రమే"
            ],
            answer: 2
        },
        {
            q: "59. కేవలం 'శ్రవ్య' బోధనోపకరణాలు",
            options: [
                "1) సంగీత వాయిద్యాలు, ల్యాప్ టాప్ లు",
                "2) రేడియో, ఎల్.సి.డి. ప్రొజెక్టర్లు",
                "3) టేప్ రికార్డర్, కంప్యూటర్లు",
                "4) రేడియో, టేప్ రికార్డర్"
            ],
            answer: 3
        },
        {
            q: "60. 'బహుళైచ్ఛిక ప్రశ్నలు' - పరిమితులలో సరియైన వానిని గుర్తించుము.\nA) నైపుణ్యాలు, వినియోగం, భావ ప్రకటనకు తావు ఉంటుంది\nB) ఊహించి జవాబులు ఎంపిక చేసే అవకాశం అసలే ఉండదు\nC) కాపీ చేయడానికి వీలుంది\nD) గుడ్డిగా గుర్తించే వీలుంది. యాంత్రిక పునఃస్మరణకు తావు ఉంది",
            options: [
                "1) A, B, C & D",
                "2) C & D మాత్రమే",
                "3) A & B మాత్రమే",
                "4) B, C & D మాత్రమే"
            ],
            answer: 1
        }
    ];

    const quizContainer = document.getElementById('quiz-container');
    const userAnswers = new Array(quizData.length).fill(null);

    function renderPoemBox() {
        const box = document.createElement('div');
        box.className = 'comprehension-box';

        const title = document.createElement('div');
        title.className = 'comprehension-title';
        title.textContent = poemBlock.title;
        box.appendChild(title);

        const poemDiv = document.createElement('div');
        poemDiv.className = 'poem-box';
        poemDiv.innerHTML = poemBlock.lines.join('<br>');
        box.appendChild(poemDiv);

        return box;
    }

    function renderPassageBox() {
        const box = document.createElement('div');
        box.className = 'comprehension-box';

        const title = document.createElement('div');
        title.className = 'comprehension-title';
        title.textContent = passageBlock.title;
        box.appendChild(title);

        const passageDiv = document.createElement('div');
        passageDiv.className = 'passage-box';
        passageDiv.textContent = passageBlock.text;
        box.appendChild(passageDiv);

        return box;
    }

    // Place the 4-line Telugu poem right above Q31 and passage right above Q35
    quizContainer.appendChild(renderPoemBox());

    quizData.forEach((item, qIndex) => {
        if (qIndex === 4) {
            quizContainer.appendChild(renderPassageBox());
        }

        const card = document.createElement('div');
        card.className = 'question-card';

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = item.q;
        card.appendChild(qText);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        item.options.forEach((opt, oIndex) => {
            const label = document.createElement('label');
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `question_${qIndex}`;
            radio.value = oIndex;

            radio.addEventListener('change', () => {
                checkAnswer(qIndex, oIndex);
            });

            label.appendChild(radio);
            label.appendChild(document.createTextNode(opt));
            optionsDiv.appendChild(label);
        });

        card.appendChild(optionsDiv);

        const feedbackDiv = document.createElement('div');
        feedbackDiv.className = 'feedback';
        feedbackDiv.id = `feedback_${qIndex}`;
        card.appendChild(feedbackDiv);

        quizContainer.appendChild(card);
    });

    function checkAnswer(qIndex, selectedIndex) {
        userAnswers[qIndex] = selectedIndex;
        const item = quizData[qIndex];
        const correctIndex = item.answer;
        const feedbackDiv = document.getElementById(`feedback_${qIndex}`);
        
        feedbackDiv.style.display = 'block';
        if (selectedIndex === correctIndex) {
            feedbackDiv.className = 'feedback correct';
            feedbackDiv.innerHTML = '✔ Right Answer! (సరైన సమాధానం)';
        } else {
            feedbackDiv.className = 'feedback wrong';
            feedbackDiv.innerHTML = `✖ Wrong Answer! (తప్పు సమాధానం) <br><span style="color:#155724;">సరైన సమాధానం: ${item.options[correctIndex]}</span>`;
        }
    }

    function calculateFinalScore() {
        let score = 0;
        let answeredCount = 0;

        userAnswers.forEach((ans, index) => {
            if (ans !== null) {
                answeredCount++;
                if (ans === quizData[index].answer) {
                    score++;
                }
            }
        });

        const scoreBoard = document.getElementById('score-board');
        scoreBoard.style.display = 'block';
        scoreBoard.innerHTML = `
            మీ ఫైనల్ స్కోర్ (Final Score): <span style="color: #28a745;">${score} / ${quizData.length}</span><br>
            <span style="font-size: 0.7em; color: #555;">(ప్రయత్నించిన ప్రశ్నలు: ${answeredCount} / ${quizData.length})</span>
        `;
        scoreBoard.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
